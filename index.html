<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drivu — prototipo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brand:#123B8C; --brand-line:#123B8C;
  --go:#1B8A4B; --info:#1F5FD1; --danger:#C62F2B; --amber:#F2B237;
  --ink:#14213D; --ink-2:#4F5B76; --line:#D6DEEA;
  --surface:#FFFFFF; --soft:#F2F5FB; --canvas:#DFE6F1;
  --map-bg:#E6EDF5; --map-road:#FFFFFF; --map-sea:#BCD4EC; --map-park:#CDE5D0;
  --go-soft:#E4F4EA; --info-soft:#E6EEFC; --danger-soft:#FBE9E8; --amber-soft:#FFF4DA;
  --fs:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-line:#8DB0FF; --go:#1E9150; --info:#3A72E0; --danger:#D23C35;
    --ink:#EAF0FA; --ink-2:#AAB6CC; --line:#2C3A57;
    --surface:#121B2D; --soft:#1A2540; --canvas:#070D19;
    --map-bg:#1B263D; --map-road:#2B3A58; --map-sea:#12314F; --map-park:#1C3A2B;
    --go-soft:#16331F; --info-soft:#172A4D; --danger-soft:#3A1B1B; --amber-soft:#3A2F12;
  }
}
:root[data-theme="dark"]{
  --brand-line:#8DB0FF; --go:#1E9150; --info:#3A72E0; --danger:#D23C35;
  --ink:#EAF0FA; --ink-2:#AAB6CC; --line:#2C3A57;
  --surface:#121B2D; --soft:#1A2540; --canvas:#070D19;
  --map-bg:#1B263D; --map-road:#2B3A58; --map-sea:#12314F; --map-park:#1C3A2B;
  --go-soft:#16331F; --info-soft:#172A4D; --danger-soft:#3A1B1B; --amber-soft:#3A2F12;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--canvas);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.device{position:relative;width:390px;height:min(844px,100%);background:var(--surface);border-radius:40px;overflow:hidden;
  box-shadow:0 0 0 10px #0B1426,0 28px 60px rgba(8,18,45,.35);font-size:var(--fs);line-height:1.4}
@media (max-width:520px){.stage{padding:0}.device{width:100%;height:100%;border-radius:0;box-shadow:none}}
#app{height:100%;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1:focus{outline:none}
.ic{flex:none}

/* Encabezado */
.hdr{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;min-height:64px}
.ttl{flex:1;margin:0;font-size:1.15em;line-height:1.2}
.backbtn{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 10px 0 4px;border:0;background:none;border-radius:12px;cursor:pointer;font-weight:700;color:var(--info)}
.backbtn:active{background:var(--soft)}
.sos{min-width:56px;min-height:44px;border:0;border-radius:22px;background:var(--danger);color:#fff;font-weight:700;letter-spacing:.04em;cursor:pointer;padding:0 14px}
.logo{border:0;background:none;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink)}
.word{font-family:'Manrope','Atkinson Hyperlegible',sans-serif;font-weight:800;letter-spacing:-.02em}
.word .u{color:var(--amber)}
.logo .word{font-size:1.45em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:22px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.9em}

/* Contenido y pie */
.content{flex:1;overflow-y:auto;padding:4px 20px 24px;-webkit-overflow-scrolling:touch}
.content.flush{padding:0}
.content.center{display:flex;flex-direction:column;justify-content:center}
.foot{padding:12px 20px 18px;border-top:1px solid var(--line);background:var(--surface)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.nav button{flex:1;min-height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8em;font-weight:700;color:var(--ink-2);cursor:pointer}
.nav button[aria-current="page"]{color:var(--info)}
.offline{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--amber-soft);color:var(--ink);font-size:.85em;font-weight:700}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:12px 18px;border:0;border-radius:16px;font-weight:700;font-size:1em;cursor:pointer;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-go{background:var(--go);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn-ghost.red{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{min-height:68px;font-size:1.08em}
.btn-link{background:none;border:0;color:var(--info);font-weight:700;min-height:44px;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-link.inline{min-height:0;padding:0}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.center-link{display:block;margin:12px auto 0}

/* Formularios */
.field{margin-bottom:16px}
.field>label{display:block;font-weight:700;margin-bottom:6px}
.inwrap{position:relative;display:flex;align-items:center}
.prefix{position:absolute;left:14px;color:var(--ink-2);font-weight:700;pointer-events:none;display:flex}
.prefix+.input{padding-left:58px}
.prefix.i+.input{padding-left:46px}
.suffix{position:absolute;right:6px;min-height:40px;padding:0 10px;border:0;background:none;color:var(--info);font-weight:700;cursor:pointer;border-radius:10px}
.input{width:100%;min-height:54px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.input.pw{padding-right:92px}
.input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 25%,transparent)}
.msg{font-size:.85em;margin:6px 0 0;color:var(--ink-2)}
.field.err .input{border-color:var(--danger)}
.field.err .msg{color:var(--danger);font-weight:700}
.checkrow{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:400}
.checkrow input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--go)}
#code,#rcode{font-size:1.6em;letter-spacing:.5em;text-align:center;font-weight:700}
.alert{padding:12px 14px;border-radius:14px;background:var(--danger-soft);color:var(--ink);border-left:5px solid var(--danger);margin-bottom:16px;font-size:.92em}
.note{padding:12px 14px;border-radius:14px;background:var(--info-soft);font-size:.9em;margin-bottom:16px}
.lead{font-size:1.02em;color:var(--ink-2);margin:0 0 20px}
.fine{font-size:.8em;color:var(--ink-2);text-align:center;margin:12px 0 0}

/* Bienvenida */
.hero{text-align:center;padding:10px 6px}
.hero-mark{width:176px;height:176px;margin:0 auto 18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.hero .word{font-size:3.1em;line-height:1;margin:0;background:none;border:0;color:var(--ink);cursor:default}
.hero .tag{margin:6px 0 20px;font-size:1.1em;color:var(--ink-2)}

/* Inicio */
.greet{margin:6px 0 0;color:var(--ink-2);font-size:1em}
.q{margin:2px 0 16px;font-size:1.45em;line-height:1.2}
.lvl{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border:2px solid var(--line);border-radius:20px;background:var(--surface);color:var(--brand-line);font-weight:700;font-size:.78em;cursor:pointer;min-height:40px}
.lvl span{color:var(--ink)}
.dest{display:flex;align-items:center;gap:14px;width:100%;min-height:88px;margin-bottom:12px;padding:14px 16px;border:0;border-radius:20px;background:var(--go);color:#fff;text-align:left;cursor:pointer}
.dest-ic{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.dest-tx{flex:1;display:flex;flex-direction:column;min-width:0}
.dest-n{font-weight:700;font-size:1.1em}
.dest-a{font-size:.8em;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-p{font-weight:700;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:12px;font-size:.9em;white-space:nowrap}
.empty{padding:20px;border:2px dashed var(--line);border-radius:18px;text-align:center;margin-bottom:14px}
.empty p{margin:0 0 14px;color:var(--ink-2)}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:0 16px;border:2px solid var(--line);border-radius:16px;background:var(--soft);cursor:pointer;color:var(--ink-2);font-weight:700;text-align:left;margin:14px 0}
.sec{font-size:1em;margin:22px 0 10px}
.favgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:10px 6px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.82em;text-align:center;color:var(--ink)}
.fav svg{color:var(--go)}
.fav-add svg{color:var(--info)}
.fav[aria-checked="true"]{border-color:var(--go);background:var(--go-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:22px;background:var(--surface);cursor:pointer;font-weight:700;font-size:.85em;color:var(--ink)}
.chip svg{color:var(--go)}
.chip.on{background:var(--go-soft);border-color:var(--go)}
.mapbox{position:relative;height:180px;overflow:hidden;background:var(--map-bg)}
.mapbox.r{border-radius:18px}
.mapbox.tall{height:300px}
.mapbox.trip{height:300px}
.map{width:100%;height:100%;display:block}
.floating{position:absolute;left:16px;right:16px;bottom:14px}
.floating .searchbar{margin:0;background:var(--surface);box-shadow:0 8px 20px rgba(10,25,60,.18)}
.hint{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--amber-soft);margin:10px 0}
.hint p{margin:0;font-weight:700}

/* Listas */
.list{list-style:none;margin:0;padding:0}
.rowb{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.rowb .t{flex:1;display:flex;flex-direction:column;min-width:0}
.rowb .t b{font-weight:700}
.rowb .t small{color:var(--ink-2);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb .lead-ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--info);flex:none}
.rowb .lead-ic.g{color:var(--go)}
.rowb .lead-ic.r{color:var(--danger)}
.rowact{display:flex;align-items:center;gap:4px}
.icon-btn{min-width:48px;min-height:48px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:active{background:var(--soft)}
.badge{font-size:.72em;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--go-soft);color:var(--ink);white-space:nowrap}
.badge.x{background:var(--danger-soft)}
.badge.d{background:var(--info-soft)}
.profile-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--soft);margin:6px 0 10px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2em;flex:none}

/* Confirmación */
.route{padding:14px 16px;border-radius:18px;background:var(--soft);margin:14px 0}
.rp{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.rp+.rp{border-top:1px dashed var(--line)}
.dot{width:14px;height:14px;border-radius:50%;margin-top:6px;flex:none}
.dot.o{background:var(--info)}
.dot.d{background:var(--go)}
.rl{display:block;font-size:.78em;color:var(--ink-2);font-weight:700}
.rv{display:block;font-weight:700}
.ra{display:block;font-size:.82em;color:var(--ink-2)}
.fare{padding:16px;border-radius:18px;border:2px solid var(--go);background:var(--go-soft);margin-bottom:14px}
.fare .amt{font-size:2em;font-weight:700;margin:2px 0}
.fare p{margin:0}
.svc{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.svc[aria-checked="true"]{border-color:var(--go);background:var(--go-soft)}
.svc .t{flex:1}
.svc .t b{display:block}
.svc .t small{color:var(--ink-2);font-size:.8em}
.svc .p{font-weight:700}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;flex:none}
[aria-checked="true"] .radio{border-color:var(--go)}
[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--go)}
.offer{padding:14px;border-radius:16px;border:2px solid var(--line);margin-bottom:14px}
.offer>p{margin:0 0 10px;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.5em;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper output{flex:1;text-align:center;font-size:1.5em;font-weight:700}
.offer .msg.warn{color:var(--danger);font-weight:700}
.payrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.payrow span.t{flex:1}
.payrow .chg{color:var(--info);font-weight:700}

/* Buscando */
.pulse{width:150px;height:150px;margin:0 auto 26px;border-radius:50%;background:var(--info-soft);display:grid;place-items:center;position:relative}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--info);animation:ring 2.2s ease-out infinite;opacity:0}
.pulse::after{animation-delay:1.1s}
.pulse .core{width:70px;height:70px;border-radius:50%;background:var(--info);color:#fff;display:grid;place-items:center}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.big-t{font-size:1.35em;margin:0 0 8px;text-align:center}
.sub-t{text-align:center;color:var(--ink-2);margin:0}

/* Viaje */
.tpanel{padding:16px 20px}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--go)}
.tstat{font-size:1.3em;margin:0;line-height:1.2}
.tsub{margin:4px 0 14px;color:var(--ink-2)}
.driver{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:12px}
.plate{margin-left:auto;text-align:right}
.plate b{display:inline-block;white-space:nowrap;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;font-size:1.05em;letter-spacing:.06em;background:var(--surface)}
.plate small{display:block;color:var(--ink-2);font-size:.78em;margin-top:4px}

/* Calificación */
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.star{width:56px;height:56px;border:0;background:none;cursor:pointer;color:var(--line);display:grid;place-items:center}
.star svg{width:44px;height:44px}
.star.on{color:var(--amber)}
.star.on svg{fill:var(--amber)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--ink-2)}
.kv b{text-align:right}

/* Ajustes */
.radiocard{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.radiocard[aria-checked="true"]{border-color:var(--go);background:var(--go-soft)}
.radiocard b{display:block}
.radiocard small{color:var(--ink-2);font-size:.82em}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{flex:1;min-height:52px;border:0;border-radius:11px;background:none;cursor:pointer;font-weight:700;color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(10,25,60,.15)}
details{border-bottom:1px solid var(--line)}
summary{min-height:56px;display:flex;align-items:center;font-weight:700;cursor:pointer;list-style:none;padding:8px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.3em;color:var(--info)}
details[open] summary::after{content:"–"}
details p{margin:0 0 14px;color:var(--ink-2)}

/* Capas */
#overlay{position:absolute;inset:0;z-index:30;display:none}
#overlay.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(6,14,32,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px 22px}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 8px;font-size:1.25em}
.sheet p{color:var(--ink-2);margin:0 0 16px}
.sheet.wiz{background:#0E1626;color:#E9EEF8;font-size:15px}
.sheet.wiz h2,.sheet.wiz b{color:#fff}
.sheet.wiz p,.sheet.wiz small{color:#9FB0CC}
.wizgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 14px}
.wizgrid button,.wizrow button{min-height:44px;border-radius:10px;border:1px solid #33456A;background:#16223A;color:#E9EEF8;cursor:pointer;font-weight:700;font-size:.9em}
.wizgrid button[aria-pressed="true"],.wizrow button[aria-pressed="true"]{background:#F2B237;color:#14213D;border-color:#F2B237}
.wizrow{display:flex;gap:6px;margin:6px 0 14px}
.wizrow button{flex:1}
.wiz textarea{width:100%;height:120px;border-radius:10px;border:1px solid #33456A;background:#0A111F;color:#CFE0FF;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:8px}
.adapt{text-align:center}
.adapt .bk{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px;color:var(--brand-line)}
.callscreen{text-align:center;padding:10px 0}
.callscreen .avatar{width:84px;height:84px;margin:0 auto 12px;font-size:1.6em}
#toast{position:absolute;left:16px;right:16px;top:70px;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#14213D;color:#fff;font-size:.9em;font-weight:700;
  transform:translateY(-16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast span{flex:1}
.toast-act{border:0;background:none;color:var(--amber);font-weight:700;cursor:pointer;min-height:40px;padding:0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script>
(function(){
'use strict';

/* ---------- Datos base ---------- */
var KEY='drivu-proto-v1', LOGKEY='drivu-proto-log-v1';

function log(ev,detail){
  R.log.push({t:new Date().toISOString(),pantalla:R.screen||'',evento:ev,detalle:detail==null?'':String(detail),nivel:U()?U().level:''});
  if(R.log.length>2000)R.log.shift();saveLog();
}
function track(type,detail){
  log(type,detail);
  if(!R.task)return;
  if(type==='atras')R.task.backs++;
  if(type==='toque_fuera')R.task.misses++;
  if(type==='error')R.task.errors++;
  if(type==='ayuda')R.task.help++;
}
function startTask(name){R.task={name:name,start:Date.now(),backs:0,misses:0,errors:0,help:0};log('tarea_inicio',name)}
function endTask(ok){
  if(!R.task)return null;var t=R.task;t.ms=Date.now()-t.start;t.ok=ok;
  log('tarea_fin',t.name+'|'+(ok?'exito':'abandono')+'|'+(t.ms/1000).toFixed(1)+'s|atras='+t.backs+'|toques_fuera='+t.misses+'|errores='+t.errors+'|ayuda='+t.help);
  R.lastTask=t;R.task=null;return t;
}
/* Motor adaptativo (reglas que simulan al clasificador de ML; el facilitador puede forzarlo desde el panel) */
function evaluateAdaptation(t){
  var u=U();if(!u||!t||u.settings.mode!=='auto')return;
  var L=u.level;
  var limit=L===1?45000:(L===2?40000:35000);
  var fluent=t.backs===0&&t.misses<=1&&t.errors===0&&t.help===0&&t.ms<limit;
  var struggle=t.backs>=3||t.misses>=4||t.errors>=2||t.help>=1||t.ms>120000;
  if(fluent&&L<3)R.pendingAdapt={from:L,to:L+1};
  else if(struggle&&L>1)R.pendingAdapt={from:L,to:L-1};
  log('clasificacion',fluent?'fluido':(struggle?'con_dificultad':'intermedio'));
}

  var ae=document.activeElement,key=null,scroll=0,oldMain=document.getElementById('main');
  if(!fresh){if(ae&&ae.getAttribute&&ae.getAttribute('data-act'))key=[ae.getAttribute('data-act'),ae.getAttribute('data-arg')];if(oldMain)scroll=oldMain.scrollTop}
  var sc=SCREENS[R.screen];var v=sc.view(R.params)||{};var u=U();
  var showBack=!v.noBack&&R.stack.length>0;
  var showNav=!!(u&&u.level>=2&&NAV_SCREENS.indexOf(R.screen)>-1);
  var hdr=v.header!==undefined?v.header:('<header class="hdr">'+(showBack?backBtn():'')+'<h1 class="ttl" tabindex="-1">'+(v.title||'')+'</h1>'+(v.sos?sosBtn():'')+'</header>');
  app.innerHTML=(R.offline?offlineBar():'')+hdr+'<main class="content '+(v.cls||'')+'" id="main">'+(v.html||'')+'</main>'+(v.foot?'<div class="foot">'+v.foot+'</div>':'')+(showNav?navBar():'');
  applyTextSize();
  if(sc.mount)sc.mount(R.params);
  if(!fresh){var nm=document.getElementById('main');if(nm)nm.scrollTop=scroll}
  if(key&&!app.contains(document.activeElement)){var sel='[data-act="'+key[0]+'"]'+(key[1]!=null?'[data-arg="'+(window.CSS&&CSS.escape?CSS.escape(key[1]):key[1])+'"]':'');var el=app.querySelector(sel);if(el)el.focus({preventScroll:true})}
  if(!app.contains(document.activeElement)){var h=app.querySelector('h1');if(h)h.focus({preventScroll:true})}
}

function codeView(id,phone,btn){
  return '<p class="lead">Te enviamos un código de 4 dígitos por SMS al <strong>+51 '+maskPhone(phone)+'</strong>.</p>'+
    '<form id="cf" novalidate>'+field({id:id,label:'Código',attrs:'inputmode="numeric" autocomplete="one-time-code" maxlength="4"',hint:'Revisa tus mensajes de texto.'})+
    '<button class="btn btn-go big" type="submit" id="cbtn" disabled>'+btn+'</button>'+
    '<p class="fine" id="rs">Podrás pedir otro código en 30 s</p></form>';
}
function codeMount(id,onOk){
  var i=document.getElementById(id),b=$('#cbtn'),left=30;
  i.addEventListener('input',function(){i.value=i.value.replace(/\D/g,'').slice(0,4);b.disabled=i.value.length!==4;if(i.value.length===4)clearErr(id)});
  every(function(){left--;var rs=$('#rs');if(!rs)return;if(left>0)rs.textContent='Podrás pedir otro código en '+left+' s';else rs.innerHTML='<button type="button" class="btn-link" data-act="resend">Enviar otro código</button>'},1000);
  $('#cf').addEventListener('submit',function(e){e.preventDefault();if(i.value.length!==4){setErr(id,'El código tiene 4 dígitos.');track('error','codigo');return}onOk()});
  i.focus();
}

},mount:function(){
  if(!R.task)startTask('pedir_viaje');
  if(R.pendingAdapt){later(showAdapt,450);return}
  var u=U();
  if(R.idleOff){R.idleOff();R.idleOff=null}
  if(u.level>=2&&u.settings.mode==='auto'&&!R.flags.idleOffered){
    var arm=function(){if(R.idleT)clearTimeout(R.idleT);R.idleT=setTimeout(offerSimpler,25000)};
    var h=function(){arm()};
    app.addEventListener('pointerdown',h);app.addEventListener('keydown',h);arm();
    R.idleOff=function(){app.removeEventListener('pointerdown',h);app.removeEventListener('keydown',h);clearTimeout(R.idleT)};
  }
}};
function offerSimpler(){
  var s=$('#hintSlot');if(!s||R.screen!=='home')return;
  log('pausa_detectada','25s sin actividad');
  s.innerHTML='<div class="hint" role="status"><p>¿Te ayudamos a pedir tu viaje?</p><div class="row2"><button class="btn btn-go" type="button" data-act="simplifyNow">Ver versión sencilla</button><button class="btn btn-ghost" type="button" data-act="dismissHint">No, gracias</button></div></div>';
}
function showAdapt(){
  var a=R.pendingAdapt;R.pendingAdapt=null;if(!a)return;
  var u=U();u.level=a.to;save();log('adaptacion',a.from+'->'+a.to);render();
  var up=a.to>a.from;
  sheet('<div class="adapt"><div class="bk">'+bike(a.from,64)+ic('chev',28)+bike(a.to,64)+'</div>'+
    '<h2 id="sh-t">'+(up?'Te mostramos más opciones':'Simplificamos tu pantalla')+'</h2>'+
    '<p>'+(up?'Notamos que ya pides tus viajes con seguridad. Ahora puedes buscar cualquier destino y elegir el tipo de auto.':'Notamos que algunos pasos te tomaron más tiempo. Dejamos a la vista solo lo necesario para pedir tu viaje.')+'</p>'+
    '<button class="btn btn-go" type="button" data-act="closeSheet">Entendido</button>'+
    '<button class="btn btn-ghost mt8" type="button" data-act="undoAdapt" data-arg="'+a.from+'">Prefiero como estaba</button>'+
    '<p class="fine">Puedes cambiarlo cuando quieras en Mi cuenta, opción “Cómo se ve Drivu”.</p></div>');
}

SCREENS.search={view:function(p){var fav=p.for==='fav';return {title:fav?'Elige la dirección':'¿A dónde vas?',
  html:'<div class="field"><label for="q">'+(fav?'Busca el lugar que quieres guardar':'Busca un lugar o una dirección')+'</label><div class="inwrap"><span class="prefix i">'+ic('search')+'</span><input class="input" id="q" type="search" placeholder="Ej.: hospital, Larcomar, aeropuerto" autocomplete="off" value="'+esc(R.searchQ||'')+'"></div></div><div id="res" aria-live="polite"></div>'}},
  mount:function(p){
    var q=$('#q'),res=$('#res'),u=U(),fav=p.for==='fav';
    function row(act,arg,icon,t,s,cls){return '<li><button type="button" class="rowb" data-act="'+act+'" data-arg="'+esc(arg)+'"><span class="lead-ic '+(cls||'')+'">'+ic(icon)+'</span><span class="t"><b>'+esc(t)+'</b><small>'+esc(s)+'</small></span></button></li>'}
    function draw(){
      var text=q.value.trim();R.searchQ=q.value;var h='';
      if(!text){
        if(!fav&&u.favorites.length)h+='<h2 class="sec">Tus lugares</h2><ul class="list">'+u.favorites.map(function(f){var pl=placeOf(f);return row('pickFav',f.id,f.icon||'pin',f.name,pl.addr,'g')}).join('')+'</ul>';
        if(!fav){var r=recentList(u,3);if(r.length)h+='<h2 class="sec">Recientes</h2><ul class="list">'+r.map(function(x){return row('repeat',x.id,'clock',x.to,x.addr)}).join('')+'</ul>'}
        h+='<h2 class="sec">Lugares populares</h2><ul class="list">'+PLACES.slice(0,6).map(function(pl){return row('pickPlace',pl.id,pl.icon,pl.name,pl.addr)}).join('')+'</ul>';
      }else{
        var nq=norm(text);var found=PLACES.filter(function(pl){return norm(pl.name+' '+pl.addr).indexOf(nq)>-1});
        if(found.length)h+='<ul class="list">'+found.map(function(pl){return row('pickPlace',pl.id,pl.icon,pl.name,pl.addr)}).join('')+'</ul>';
        else h+='<div class="note">No encontramos “'+esc(text)+'”. Revisa cómo se escribe o prueba con el nombre de un lugar cercano.</div>';
        if(text.length>=4)h+='<ul class="list">'+row('pickCustom',text,'pin','Usar “'+text+'” como dirección','Escribe calle y número para que el conductor llegue bien')+'</ul>';
      }
      res.innerHTML=h;
    }
    q.addEventListener('input',draw);draw();q.focus();
  }};

SCREENS.confirm={view:function(){
  var u=U(),L=u.level,d=R.draft;if(!d)return {title:'Confirmar viaje',html:''};
  var base=price(d.dest.km,d.svc),fin=d.offer!=null?d.offer:base,pay=payOf(d.pay),s=svcOf(d.svc);
  var h='<div class="mapbox r" style="height:'+(L===1?140:170)+'px">'+mapSVG({route:true,label:'Ruta hacia '+d.dest.name})+'</div>'+
    '<div class="route"><div class="rp"><span class="dot o"></span><div><span class="rl">Desde</span><span class="rv">'+ORIGIN.name+'</span><span class="ra">'+ORIGIN.addr+'</span></div></div>'+
    '<div class="rp"><span class="dot d"></span><div><span class="rl">Hasta</span><span class="rv">'+esc(d.dest.name)+'</span><span class="ra">'+esc(d.dest.addr)+'</span></div></div></div>';
  if(L===1){
    h+='<div class="fare"><p style="font-weight:700">'+s.name+' · '+s.desc.toLowerCase()+'</p><p class="amt">'+money(base)+'</p><p>Este es el precio final. No cambia durante el viaje.</p><p class="mt8">Un conductor llega por ti en unos '+s.eta+' minutos.</p></div>';
  }else{
    h+='<h2 class="sec" id="svcL">Elige tu auto</h2><div role="radiogroup" aria-labelledby="svcL">'+SERVICES.map(function(x){
      return '<button type="button" class="svc" role="radio" aria-checked="'+(x.id===d.svc)+'" data-act="svc" data-arg="'+x.id+'"><span class="radio"></span><span class="t"><b>'+x.name+'</b><small>'+x.desc+' · llega en '+x.eta+' min</small></span><span class="p">'+money(price(d.dest.km,x.id))+'</span></button>'}).join('')+'</div>';
    if(L===3){
      var low=fin<base*0.85;
      h+='<div class="offer"><p>¿Quieres ofrecer otra tarifa?</p><div class="stepper"><button type="button" data-act="offer" data-arg="-0.5" aria-label="Bajar 50 céntimos">−</button><output id="offerV" aria-live="polite">'+money(fin)+'</output><button type="button" data-act="offer" data-arg="0.5" aria-label="Subir 50 céntimos">+</button></div>'+
        '<p class="msg'+(low?' warn':'')+'">'+(low?'Con una tarifa tan baja es posible que ningún conductor acepte. Sugerido: '+money(base)+'.':(d.offer!=null?'Los conductores cercanos verán tu oferta. <button type="button" class="btn-link inline" data-act="offerReset">Volver al precio sugerido</button>':'Precio sugerido para este recorrido.'))+'</p></div>';
    }
  }
  h+='<button type="button" class="payrow" data-act="paySheet">'+ic(payIcon(pay))+'<span class="t">Pagas con <strong>'+esc(payLabel(pay))+'</strong></span><span class="chg">Cambiar</span></button>';
  var foot=R.offline?'<p class="alert" style="margin:0 0 10px">No hay conexión. Pediremos el viaje cuando vuelva la señal.</p><button class="btn btn-go big" type="button" disabled>Confirmar viaje</button>':
    '<button class="btn btn-go big" type="button" data-act="request">'+(L===1?'Confirmar viaje':'Pedir '+s.name+' · '+money(fin))+'</button>';
  foot+='<button class="btn btn-ghost mt8" type="button" data-act="back">Cambiar destino</button>';
  return {title:'Revisa tu viaje',sos:true,html:h,foot:foot};
}};

SCREENS.searching={view:function(p){
  if(p.fail)return {title:'Sin conductores',noBack:true,cls:'center',
    html:'<div class="pulse" style="background:var(--amber-soft)"><div class="core" style="background:var(--amber);color:#14213D">'+ic('car',34)+'</div></div><h2 class="big-t">No hay conductores cerca en este momento</h2><p class="sub-t">Suele pasar en horas de mucho tráfico. Puedes intentarlo otra vez o elegir otro tipo de auto.</p>',
    foot:'<button class="btn btn-go big" type="button" data-act="retry">Intentar de nuevo</button><button class="btn btn-ghost mt8" type="button" data-act="back">Elegir otro auto</button>'};
  return {title:'Buscando conductor',noBack:true,cls:'center',
    html:'<div class="pulse"><div class="core">'+ic('car',34)+'</div></div><h2 class="big-t" role="status">Buscando un conductor cerca de ti…</h2><p class="sub-t">Normalmente tarda menos de un minuto.</p>',
    foot:'<button class="btn btn-ghost red" type="button" data-act="cancelSearch">Cancelar búsqueda</button>'};
},mount:function(p){
  if(p.fail)return;
  later(function(){
    if(R.noDrivers){log('sin_conductores');R.params.fail=true;render();return}
    var d=R.draft,s=svcOf(d.svc),base=price(d.dest.km,d.svc);
    R.trip={dest:d.dest,svc:d.svc,price:d.offer!=null?d.offer:base,pay:payLabel(payOf(d.pay)),driver:DRIVERS[d.svc],car:s.car,phase:0,eta0:s.eta,eta:s.eta,ride0:Math.max(4,Math.round(d.dest.km*1.6)),ride:0,k:0};
    R.trip.ride=R.trip.ride0;log('conductor_asignado',R.trip.driver.name);
    go('trip',{},{replace:true});
  },3500);
}};

SCREENS.trip={view:function(){
  var t=R.trip;if(!t)return {title:'',html:''};
  return {header:'<header class="hdr"><h1 class="ttl" tabindex="-1">Tu viaje</h1>'+sosBtn()+'</header>',cls:'flush',
    html:'<div class="mapbox trip">'+mapSVG({route:true,trip:true,label:'Mapa del viaje en curso'})+'</div>'+
    '<div class="tpanel"><div class="steps" aria-hidden="true"><i id="s0" class="on"></i><i id="s1"></i><i id="s2"></i></div>'+
    '<h2 class="tstat" id="tStat" role="status"></h2><p class="tsub" id="tSub"></p>'+
    '<div class="driver"><span class="avatar">'+initials(t.driver.name)+'</span><div><b>'+esc(t.driver.name)+'</b><div style="font-size:.85em;color:var(--ink-2)">'+ic('star',14)+' '+t.driver.rating+' · '+esc(t.car)+'</div></div><div class="plate"><b>'+t.driver.plate+'</b><small>Placa</small></div></div>'+
    '<div class="row2"><button class="btn btn-info" type="button" data-act="callDriver">'+ic('phone')+'Llamar</button><button class="btn btn-info" type="button" data-act="shareTrip">'+ic('share')+'Compartir</button></div>'+
    '<button class="btn btn-ghost red mt8" type="button" data-act="cancelTrip">Cancelar viaje</button></div>'};
},mount:function(){
  var t=R.trip;if(!t)return;
  function paint(){
    var st=$('#tStat'),sb=$('#tSub');if(!st)return;
    $('#s1').className=t.phase>=1?'on':'';$('#s2').className=t.phase>=2?'on':'';
    if(t.phase===0){st.textContent=firstName(t.driver.name)+' llega en '+t.eta+' min';sb.textContent='Espéralo en '+ORIGIN.addr+'.';placeCar('approach',1-t.eta/t.eta0)}
    else if(t.phase===1){st.textContent='Tu conductor llegó';sb.textContent='Busca un '+t.car+' con placa '+t.driver.plate+'.';placeCar('approach',1)}
    else{st.textContent='Vas a '+t.dest.name;sb.textContent='Llegas en unos '+t.ride+' min.';placeCar('route',1-t.ride/t.ride0)}
  }
  paint();
  every(function(){
    t.k++;
    if(t.phase===0&&t.k%3===0){t.eta--;if(t.eta<=0){t.phase=1;t.k=0;log('conductor_llego')}}
    else if(t.phase===1&&t.k>=5){t.phase=2;t.k=0;log('viaje_iniciado')}
    else if(t.phase===2&&t.k%2===0){t.ride--;if(t.ride<=0){log('viaje_terminado');R.rate={stars:0,tags:[]};go('rate',{},{replace:true});return}}
    paint();
  },1000);
}};

SCREENS.payAdd={view:function(p){
  var t=p.type||'card';
  return {title:'Agregar método de pago',
    html:'<div class="seg" role="radiogroup" aria-label="Tipo de pago"><button type="button" role="radio" aria-checked="'+(t==='card')+'" data-act="payType" data-arg="card">Tarjeta</button><button type="button" role="radio" aria-checked="'+(t==='yape')+'" data-act="payType" data-arg="yape">Yape</button></div>'+
    '<form id="pyf" novalidate class="mt16">'+(t==='card'?
      field({id:'cnum',label:'Número de tarjeta',attrs:'inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="0000 0000 0000 0000"'})+
      '<div class="row2">'+field({id:'cexp',label:'Vence',attrs:'inputmode="numeric" autocomplete="cc-exp" maxlength="5" placeholder="MM/AA"'})+field({id:'ccvv',label:'CVV',attrs:'inputmode="numeric" autocomplete="cc-csc" maxlength="4"',hint:'3 dígitos al reverso'})+'</div>'+
      field({id:'cname',label:'Nombre en la tarjeta',attrs:'autocomplete="cc-name"'}):
      field({id:'yphone',label:'Celular afiliado a Yape',prefix:'+51',attrs:'inputmode="numeric" maxlength="9"'}))+
    '<label class="checkrow"><input type="checkbox" id="asDefault" checked><span>Usar como método principal</span></label>'+
    '<p class="fine" style="text-align:left">'+ic('lock',14)+' Tus datos se guardan cifrados. Nunca compartimos tu tarjeta con el conductor.</p>'+
    '<button class="btn btn-go big mt16" type="submit">Guardar</button></form>'};
},mount:function(p){
  var t=p.type||'card';
  if(t==='card'){
    $('#cnum').addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,16);this.value=d.replace(/(.{4})/g,'$1 ').trim()});
    $('#cexp').addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,4);this.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d});
    $('#cnum').focus();
  }else $('#yphone').focus();
  $('#pyf').addEventListener('submit',function(e){
    e.preventDefault();var u=U(),item=null,bad=null;
    if(t==='card'){
      var n=val('cnum').replace(/\D/g,''),ex=val('cexp'),cv=val('ccvv').replace(/\D/g,''),nm=val('cname').trim();
      if(n.length!==16){setErr('cnum','El número debe tener 16 dígitos.');bad=bad||'cnum'}else clearErr('cnum');
      var m=/^(\d{2})\/(\d{2})$/.exec(ex),okExp=false;
      if(m){var mm=+m[1],yy=2000+(+m[2]),now=new Date();okExp=mm>=1&&mm<=12&&(yy>now.getFullYear()||(yy===now.getFullYear()&&mm>=now.getMonth()+1))}
      if(!okExp){setErr('cexp','Revisa la fecha: MM/AA y aún vigente.');bad=bad||'cexp'}else clearErr('cexp');
      if(cv.length<3){setErr('ccvv','Escribe los 3 dígitos.');bad=bad||'ccvv'}else clearErr('ccvv');
      if(nm.length<3){setErr('cname','Escribe el nombre como aparece en la tarjeta.');bad=bad||'cname'}else clearErr('cname');
      var brand=n[0]==='4'?'Visa':(n[0]==='5'?'Mastercard':(n[0]==='3'?'Amex':'Tarjeta'));
      item={id:'card'+Date.now(),type:'card',label:brand,detail:'•••• '+n.slice(-4)};
    }else{
      var ph=val('yphone').replace(/\D/g,'');
      if(V.phone(ph)){setErr('yphone',V.phone(ph));bad='yphone'}else clearErr('yphone');
      item={id:'yape'+Date.now(),type:'yape',label:'Yape',detail:maskPhone(ph)};
    }
    if(bad){track('error','pago:'+bad);document.getElementById(bad).focus();return}
    u.payments.push(item);if($('#asDefault').checked)u.defaultPay=item.id;
    if(R.draft&&$('#asDefault').checked)R.draft.pay=item.id;
    save();log('pago_agregado',item.label);back(true);toast(item.label+' guardado');
  });
}};

    '<button class="btn btn-ghost" type="button" data-act="nav" data-arg="payAdd">'+ic('plus')+'Agregar método de pago</button>');

ACT.callSupport=function(){callSheet('Soporte Drivu','Atención las 24 horas','soporte')};
function callSheet(name,sub,kind){
  log('llamada',kind);
  sheet('<div class="callscreen"><span class="avatar" style="display:grid">'+(kind==='sos'?ic('shield',38):initials(name))+'</span><h2 id="sh-t">'+esc(name)+'</h2><p id="callSt">Llamando…</p><p style="margin-top:-10px">'+esc(sub)+'</p>'+
    '<button class="btn btn-danger big" type="button" data-act="closeSheet">'+ic('phone')+'Terminar llamada</button></div>');

}
ACT.shareTrip=function(){
  var c=U().contacts;
  if(!c.length){sheet('<h2 id="sh-t">Comparte tu viaje</h2><p>Aún no tienes contactos de confianza. Agrega uno para enviarle tu ubicación en vivo.</p><button class="btn btn-go" type="button" data-act="goContactsFromSheet">Agregar contacto</button><button class="btn btn-ghost mt8" type="button" data-act="closeSheet">Ahora no</button>');return}
  sheet('<h2 id="sh-t">Comparte tu viaje</h2><p>Verán tu ubicación y los datos del conductor hasta que llegues.</p><ul class="list">'+c.map(function(x){return '<li><button type="button" class="rowb" data-act="sendShare" data-arg="'+x.id+'"><span class="avatar" style="width:42px;height:42px;font-size:.9em">'+initials(x.name)+'</span><span class="t"><b>'+esc(x.name)+'</b><small>+51 '+maskPhone(x.phone)+'</small></span>'+ic('share',20)+'</button></li>'}).join('')+'</ul>');
};
ACT.goContactsFromSheet=function(){closeSheet();toast('Podrás agregar contactos al terminar tu viaje, desde Mi cuenta.')};
ACT.sendShare=function(id){var c=U().contacts.filter(function(x){return x.id===id})[0];closeSheet();log('viaje_compartido',c?c.name:'');toast('Enviamos tu viaje en vivo a '+esc(c?c.name:'tu contacto'))};

    '<button class="btn btn-danger" type="button" data-act="confirmCancel">Sí, cancelar viaje</button><button class="btn btn-go mt8" type="button" data-act="closeSheet">No, seguir con mi viaje</button>');
};

  var t=R.trip,u=U(),fee=t.phase>=1?3:0;
  u.history.push({id:'t'+Date.now(),date:Date.now(),to:t.dest.name,addr:t.dest.addr,km:t.dest.km,svc:t.svc,price:fee,pay:t.pay,driver:t.driver.name,plate:t.driver.plate,rating:0,status:'cancelled'});
  save();log('viaje_cancelado','cargo='+fee);R.trip=null;R.pendingAdapt=null;go('home',{},{reset:true});toast(fee?'Viaje cancelado. Se cobró '+money(fee)+'.':'Viaje cancelado. No se cobró nada.');
};
ACT.star=function(n){n=+n;R.rate.stars=n;document.querySelectorAll('.star').forEach(function(b,i){var on=i<n;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on&&i===n-1?'true':'false')});
  var msgs=['','Muy malo','Malo','Regular','Bueno','Excelente'];$('#starMsg').textContent=msgs[n];$('#rateBtn').disabled=false};
ACT.tag=function(x,el){var i=R.rate.tags.indexOf(x);if(i>-1)R.rate.tags.splice(i,1);else R.rate.tags.push(x);var on=i<0;el.classList.toggle('on',on);el.setAttribute('aria-pressed',on)};
function finishTrip(rating){
  var t=R.trip,u=U();if(!t)return;
  u.history.push({id:'t'+Date.now(),date:Date.now(),to:t.dest.name,addr:t.dest.addr,km:t.dest.km,svc:t.svc,price:t.price,pay:t.pay,driver:t.driver.name,plate:t.driver.plate,rating:rating,status:'done'});
  save();R.trip=null;go('home',{},{reset:true});
}
ACT.sendRate=function(){log('calificacion',R.rate.stars+'|'+R.rate.tags.join(';'));finishTrip(R.rate.stars);toast('Gracias. Enviamos tu calificación.')};
ACT.skipRate=function(){log('calificacion_omitida');finishTrip(0)};
ACT.receipt=function(id){go('receipt',{id:id})};
ACT.setDefault=function(id){U().defaultPay=id;save();render();toast(esc(payOf(id).label)+' es ahora tu método principal')};
ACT.delPay=function(id){var u=U(),i=u.payments.findIndex(function(x){return x.id===id});if(i<0)return;var p=u.payments.splice(i,1)[0],wasDef=u.defaultPay===id;if(wasDef)u.defaultPay='cash';save();render();
  toast('Quitaste '+esc(p.label),{action:'Deshacer',onAction:function(){u.payments.splice(i,0,p);if(wasDef)u.defaultPay=p.id;save();render()}})};
ACT.payType=function(t){R.params.type=t;render()};
ACT.delContact=function(id){var u=U(),i=u.contacts.findIndex(function(x){return x.id===id});if(i<0)return;var c=u.contacts.splice(i,1)[0];save();render();
  toast('Quitaste a '+esc(c.name),{action:'Deshacer',onAction:function(){u.contacts.splice(i,0,c);save();render()}})};
ACT.setMode=function(m){var u=U();u.settings.mode=m;if(m==='simple')u.level=1;if(m==='complete')u.level=3;save();log('modo_vista',m);render();toast(m==='auto'?'Drivu ajustará la vista por ti':'Listo, usarás la '+LVL[u.level].name.toLowerCase())};
ACT.setText=function(t){U().settings.text=t;save();log('tamano_texto',t);render()};
ACT.logout=function(){sheet('<h2 id="sh-t">¿Cerrar sesión?</h2><p>Tus lugares y métodos de pago quedarán guardados para la próxima vez.</p><button class="btn btn-danger" type="button" data-act="doLogout">Cerrar sesión</button><button class="btn btn-ghost mt8" type="button" data-act="closeSheet">Seguir en mi cuenta</button>')};

ACT.sos=function(){
  track('sos','abrio_sos');
  sheet('<h2 id="sh-t">¿Necesitas ayuda?</h2><p>Elige qué hacer. Tu ubicación actual: '+ORIGIN.addr+'.</p>'+
    '<button class="btn btn-danger big" type="button" data-act="callPolice">'+ic('phone')+'Llamar a la Policía (105)</button>'+
    '<button class="btn btn-info mt8" type="button" data-act="alertContacts">'+ic('people')+'Avisar a mis contactos de confianza</button>'+
    '<button class="btn btn-ghost mt8" type="button" data-act="closeSheet">Estoy bien, cerrar</button>');
};
ACT.callPolice=function(){log('sos','llamada_105');callSheet('Central de Emergencias 105','Policía Nacional del Perú','sos')};
ACT.alertContacts=function(){var c=U().contacts;closeSheet();if(!c.length){toast('Aún no tienes contactos. Agrégalos en Mi cuenta.');return}log('sos','aviso_contactos');toast('Enviamos tu ubicación a '+c.map(function(x){return esc(firstName(x.name))}).join(', '))};

/* ---------- Panel del facilitador (Mago de Oz) — oculto para el participante ---------- */
function openWizard(){
  log('panel_facilitador','abierto');
  var u=U(),t=R.lastTask,live=R.task;
  var csv=toCSV();
  sheet('<h2 id="sh-t">Panel del facilitador</h2><small>Solo para quien dirige la prueba. Se abre tocando 5 veces el logo o con Shift + W.</small>'+
    (u?'<p class="mt16" style="margin-bottom:4px"><b>Vista del participante</b></p><div class="wizgrid">'+[1,2,3].map(function(n){return '<button type="button" data-act="wizLevel" data-arg="'+n+'" aria-pressed="'+(u.level===n)+'">Nivel '+n+'</button>'}).join('')+'</div>'+
    '<p style="margin-bottom:4px"><b>Adaptación automática</b></p><div class="wizrow"><button type="button" data-act="wizAuto" data-arg="auto" aria-pressed="'+(u.settings.mode==='auto')+'">Activada</button><button type="button" data-act="wizAuto" data-arg="off" aria-pressed="'+(u.settings.mode!=='auto')+'">Desactivada</button></div>'+
    '<p style="margin-bottom:4px"><b>Forzar mensaje de adaptación</b></p><div class="wizrow"><button type="button" data-act="wizPend" data-arg="up">Subir al volver al inicio</button><button type="button" data-act="wizPend" data-arg="down">Bajar al volver al inicio</button></div>':'<p class="mt16">Inicia sesión para controlar la vista del participante. Cuenta de prueba: demo@drivu.pe · Drivu2026</p>')+
    '<p style="margin-bottom:4px"><b>Simular situaciones</b></p><div class="wizrow"><button type="button" data-act="wizOffline" aria-pressed="'+R.offline+'">Sin conexión</button><button type="button" data-act="wizNoDrivers" aria-pressed="'+R.noDrivers+'">Sin conductores</button></div>'+
    '<p style="margin-bottom:4px"><b>Tarea en curso</b></p><small>'+(live?esc(live.name)+' · '+((Date.now()-live.start)/1000).toFixed(0)+' s · atrás '+live.backs+' · toques fuera '+live.misses+' · errores '+live.errors:'Ninguna')+'</small>'+
    '<p style="margin:10px 0 4px"><b>Última tarea terminada</b></p><small>'+(t?esc(t.name)+' · '+(t.ms/1000).toFixed(1)+' s · atrás '+t.backs+' · toques fuera '+t.misses+' · errores '+t.errors+' · ayuda '+t.help:'Aún no hay')+'</small>'+
    '<p style="margin:12px 0 4px"><b>Registro de la sesión ('+R.log.length+' eventos)</b></p><textarea id="wlog" readonly aria-label="Registro de eventos en formato CSV">'+esc(csv)+'</textarea>'+
    '<div class="wizrow"><button type="button" data-act="wizCopy">Copiar CSV</button><button type="button" data-act="wizClearLog">Nuevo participante</button></div>'+
    '<div class="wizrow"><button type="button" data-act="wizReset">Reiniciar prototipo</button><button type="button" data-act="closeSheet">Cerrar panel</button></div>','wiz');
}
function toCSV(){
  var rows=R.log.map(function(r){return [r.t,r.pantalla,r.evento,r.detalle,r.nivel].map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'}).join(',')});
  return 'fecha_hora,pantalla,evento,detalle,nivel\n'+rows.join('\n');
}
ACT.wizLevel=function(n){var u=U();u.level=+n;save();log('facilitador_nivel',n);closeSheet();render();openWizard()};
ACT.wizAuto=function(v){var u=U();u.settings.mode=v==='auto'?'auto':'fixed';save();log('facilitador_auto',v);closeSheet();render();openWizard()};
ACT.wizPend=function(d){var u=U(),L=u.level;R.pendingAdapt=d==='up'?(L<3?{from:L,to:L+1}:null):(L>1?{from:L,to:L-1}:null);log('facilitador_forzar',d);closeSheet();if(R.screen==='home'&&R.pendingAdapt)showAdapt();else toast('Se mostrará al volver al inicio')};
ACT.wizOffline=function(){R.offline=!R.offline;log('facilitador_sin_conexion',R.offline);closeSheet();render();openWizard()};
ACT.wizNoDrivers=function(){R.noDrivers=!R.noDrivers;log('facilitador_sin_conductores',R.noDrivers);closeSheet();openWizard()};
ACT.wizCopy=function(){var ta=$('#wlog'),txt=toCSV();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Registro copiado')},function(){ta.select();toast('Selecciona el texto y cópialo')})}else{ta.select();toast('Selecciona el texto y cópialo')}};
ACT.wizClearLog=function(){R.log=[];saveLog();R.task=null;R.lastTask=null;log('nuevo_participante');closeSheet();toast('Registro listo para un nuevo participante')};
ACT.wizReset=function(){try{localStorage.removeItem(KEY);localStorage.removeItem(LOGKEY)}catch(e){}S=seed();R.log=[];R.task=null;R.trip=null;R.draft=null;R.offline=false;R.noDrivers=false;R.pendingAdapt=null;R.flags={};go('welcome',{},{reset:true});toast('Prototipo reiniciado')};

/* ---------- Eventos globales ---------- */
var device=document.getElementById('device');
device.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){
    if(app.contains(e.target)&&!e.target.closest('button,a,input,label,select,textarea,summary,details,[role]'))track('toque_fuera',R.screen);
    return;
  }
  var fn=ACT[t.getAttribute('data-act')];
  if(fn){e.preventDefault();fn(t.getAttribute('data-arg'),t,e)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&R.sheetOpen){closeSheet();return}
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');
  if(!typing&&e.shiftKey&&(e.key==='W'||e.key==='w')){e.preventDefault();openWizard()}
});

/* Inicio */
if(U()){R.screen=null;go('home',{},{reset:true})}else go('welcome',{},{reset:true});
})();
</script>
